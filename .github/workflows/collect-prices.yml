name: collect-prices
# Read-only: pulls public NBA market prices from Kalshi and Polymarket. No keys, no trading.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub's minimum is ~5 min and runs can be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-data   # keep data commits off main; create this branch once (see README)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshot
        run: python scripts/collect_prices.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices
          git diff --cached --quiet || (git commit -m "prices $(date -u +%FT%TZ)" && git push)
