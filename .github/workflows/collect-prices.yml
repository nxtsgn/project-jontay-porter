name: collect-prices
# Read-only: snapshots NBA prices on Kalshi and Polymarket US (public endpoints, no keys, no trading),
# logs any guaranteed-payout gaps with order-book depth, and grades past gaps once their games settle.
on:
  schedule:
    - cron: "*/15 * * * *"   # backup only; GitHub's scheduler is unreliable. cron-job.org triggers this every 3 min (since 2026-11-17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-data   # data lives here; code always comes from main (next step)
          fetch-depth: 1    # latest snapshot only: the full history (~470 MB) took 2-2.5 min of every run
          filter: blob:none # and only the files this run touches (next lines + today's price file below)
          sparse-checkout: |
            /data/paper/
          sparse-checkout-cone-mode: false
      - name: Today's price file, and the latest code from main
        run: |
          git sparse-checkout add "/data/prices/prices_us_$(date -u +%F)*"
          git fetch -q --depth 1 origin main && git archive FETCH_HEAD scripts config requirements.txt | tar -x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshot, detect gaps, practice trader (sends nothing)
        run: python scripts/collect_prices.py
        env:
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}   # kill switch: set the repo variable to "false" to stop the trader
      - name: Grade settled paper hedges
        run: python scripts/grade.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add --sparse data/prices data/paper   # code from main is never staged (it was unpacked, not checked out)
          git diff --cached --quiet && exit 0
          git commit -m "prices $(date -u +%FT%TZ)"
          # retry: a brief GitHub hiccup on push used to fail the run and lose that snapshot (2026-11-16 03:40 UTC)
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push failed (try $i); retrying"; sleep $((i * 10))
            git fetch -q --depth 50 origin price-data && git rebase -q origin/price-data || true
          done
          exit 1
