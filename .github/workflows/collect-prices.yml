name: collect-prices
# Read-only: snapshots NBA prices on Kalshi and Polymarket US (public endpoints, no keys, no trading),
# logs any guaranteed-payout gaps with order-book depth, and grades past gaps once their games settle.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub's minimum is ~5 min and runs can be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-data   # data lives here; code always comes from main (next step)
          fetch-depth: 0
      - name: Use the latest code from main
        run: git checkout origin/main -- scripts requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshot and detect gaps
        run: python scripts/collect_prices.py
      - name: Grade settled paper hedges
        run: python scripts/grade.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git reset -q scripts requirements.txt   # don't copy code into the data branch
          git add data/prices data/paper 2>/dev/null || git add data/prices
          git diff --cached --quiet || (git commit -m "prices $(date -u +%FT%TZ)" && git push)
