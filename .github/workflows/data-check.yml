name: data-check
# Daily (triggered 9:00 Arizona by cron-job.org): opens a GitHub issue (GitHub then notifies you) if the price collector
# has stopped, a weekly progress issue every Monday, and the full report once there's enough live data. Read-only on the data.
on:
  schedule:
    - cron: "0 16 * * *"   # 9:00 Arizona time
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Post the weekly progress issue today even if it isn't Monday"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring in the collected data
        run: git checkout origin/price-data -- data/prices data/paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        id: check
        run: |
          out=$(python scripts/check_data.py)
          echo "$out"
          for kv in $out; do echo "$kv" >> "$GITHUB_OUTPUT"; done
      - name: Ping if the collector stopped
        if: steps.check.outputs.status == 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Price collector stopped"
          gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          gh issue create --title "$title" --body "Newest snapshot: ${{ steps.check.outputs.newest }}. Check the collect-prices runs in the Actions tab. Close this issue once it's fixed."
      - name: Weekly progress (Mondays, Arizona time)
        if: steps.check.outputs.status != 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Phoenix date +%u)" != "1" ] && [ "${{ inputs.force_weekly }}" != "true" ]; then exit 0; fi
          title="Weekly progress $(TZ=America/Phoenix date +%F)"
          gh issue list --state all --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          python scripts/progress_report.py "$title" > report.md
          gh issue create --title "$title" --body-file report.md
      - name: Ping when there's enough data
        if: steps.check.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Enough live data to review the strategy"
          gh issue list --state all --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          python scripts/progress_report.py "$title" > report.md
          printf '\n\n${{ steps.check.outputs.snapshots }} snapshots over ${{ steps.check.outputs.days }} days (newest ${{ steps.check.outputs.newest }}). Open Claude Code in project-jontay-porter and ask for the full live-data review (return estimate with a range, learner suggestions, rule changes to consider).\n\nPlanned for this review: (1) cut unhedged fills: cancel or reprice the resting Kalshi order when the Polymarket US hedge price or depth moves, and only rest when the hedge side has 2x our size; (2) decide whether the 2c minimum edge on resting orders should drop to 1.5c (several 1.2-1.8c fills hedged fine); (3) check how bet sizing that grows with the balance has behaved.\n' >> report.md
          gh issue create --title "$title" --body-file report.md
