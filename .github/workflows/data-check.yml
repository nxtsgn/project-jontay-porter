name: data-check
# Daily (triggered 9:00 Arizona by cron-job.org): a health check of every part of the bot (opens "Bot health check
# failed" if anything is off, closes it when all passes), a ping if the price collector has stopped, a weekly progress
# issue every Monday (with the health table), and the full report once there's enough live data. Read-only on the data.
on:
  schedule:
    - cron: "0 16 * * *"   # 9:00 Arizona time
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Post the weekly progress issue today even if it isn't Monday"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring in the collected data
        run: git checkout origin/price-data -- data/prices data/paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        id: check
        run: |
          out=$(python scripts/check_data.py)
          echo "$out"
          for kv in $out; do echo "$kv" >> "$GITHUB_OUTPUT"; done
      - name: Daily health check (every part of the bot)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '24 hours ago' +%FT%TZ)
          runs=$(gh run list --workflow collect-prices.yml --created ">$since" --limit 1000 --json conclusion)
          total=$(echo "$runs" | jq length)
          failed=$(echo "$runs" | jq '[.[] | select(.conclusion == "failure")] | length')
          set +e; python scripts/health_check.py --runs-total "$total" --runs-failed "$failed" > health.md; rc=$?; set -e
          cat health.md
          title="Bot health check failed"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ "$rc" -ne 0 ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body-file health.md; else gh issue create --title "$title" --body-file health.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All checks passed again on $(date -u +%F). $(sed -n 1p health.md)"
          fi
      - name: Ping if the collector stopped
        if: steps.check.outputs.status == 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Price collector stopped"
          gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          gh issue create --title "$title" --body "Newest snapshot: ${{ steps.check.outputs.newest }}. Check the collect-prices runs in the Actions tab. Close this issue once it's fixed."
      - name: Weekly progress (Mondays, Arizona time)
        if: steps.check.outputs.status != 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Phoenix date +%u)" != "1" ] && [ "${{ inputs.force_weekly }}" != "true" ]; then exit 0; fi
          title="Weekly progress $(TZ=America/Phoenix date +%F)"
          gh issue list --state all --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          python scripts/progress_report.py "$title" > report.md
          [ -f health.md ] && { echo; cat health.md; } >> report.md
          gh issue create --title "$title" --body-file report.md
      - name: Ping when there's enough data
        if: steps.check.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Enough live data to review the strategy"
          gh issue list --state all --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q . && exit 0
          python scripts/progress_report.py "$title" > report.md
          printf '\n\n${{ steps.check.outputs.snapshots }} snapshots over ${{ steps.check.outputs.days }} days (newest ${{ steps.check.outputs.newest }}). Open Claude Code in project-jontay-porter and ask for the full live-data review (return estimate with a range, learner suggestions, rule changes to consider).\n\nPlanned for this review: (1) check the unhedged-fill fixes built Nov 16 (pull orders when the hedge moves, 2x hedge depth; compare the unhedged share before/after and the Oracle hedger's seconds-to-hedge log); (2) decide whether the 2c minimum edge on resting orders should drop to 1.5c (several 1.2-1.8c fills hedged fine); (3) check how bet sizing that grows with the balance has behaved; (4) Kalshi capital is full in ~45% of runs: re-test ranking resting orders by edge per dollar tied up (on Nov 17 data it cut unhedged fills 6 to 3 but not profit; only 15 fills, too few to act on).\n' >> report.md
          gh issue create --title "$title" --body-file report.md
