name: hedger
# STOPGAP until the Oracle server is up (deploy/oracle/README.md): runs the always-on hedger (practice mode, sends no
# orders, no keys) on GitHub's servers in ~6-hour shifts. It checks Kalshi's trade tape every ~5 s instead of the
# collector's 5 minutes and logs to the hedger-data branch. Once Oracle is running, disable this workflow
# (Actions tab -> hedger -> "..." -> Disable workflow) so the two don't both write fast_hedges.csv.
on:
  schedule:
    - cron: "0 */6 * * *"   # a new shift every 6 hours (each lasts ~5h50m)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/hedger.yml]   # start a shift right away when this file changes

permissions:
  contents: write

concurrency:
  group: hedger
  cancel-in-progress: false

jobs:
  hedge:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up the hedger-data log branch
        env:
          PUSH: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git config user.name "hedger-bot"; git config user.email "hedger-bot@users.noreply.github.com"
          D=$RUNNER_TEMP/hedger-data
          git init -q "$D" && git -C "$D" remote add origin "$PUSH" && git -C "$D" checkout -q -b hedger-data
          git -C "$D" config user.name "hedger-bot"; git -C "$D" config user.email "hedger-bot@users.noreply.github.com"
          git -C "$D" fetch -q origin hedger-data 2>/dev/null && git -C "$D" reset -q --hard origin/hedger-data || true
      - name: Run the hedger (practice mode) for ~5h50m
        run: |
          D=$RUNNER_TEMP/hedger-data
          end=$((SECONDS + 21000))
          while [ $SECONDS -lt $end ]; do
            # exits on its own when main gets new code (every 30 min check); then restart on the new code
            timeout --signal=INT $((end - SECONDS)) python -u scripts/hedger.py --data-dir "$D" || true
            git pull -q --ff-only origin main || true
            sleep 5
          done
      - name: Save the last minutes of the log
        if: always()
        run: |
          D=$RUNNER_TEMP/hedger-data
          cd "$D" && [ -f fast_hedges.csv ] || exit 0
          git add fast_hedges.csv
          git diff --cached --quiet && exit 0
          git commit -qm "hedger $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push -q origin HEAD:hedger-data && exit 0; sleep 10; git pull -q --rebase origin hedger-data || true; done
